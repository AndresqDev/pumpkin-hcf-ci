name: B1 Linux ARM64 release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch/tag to build
        required: true
        default: "perf/fluidity"
        type: string
      rust_toolchain_version:
        description: Rust toolchain version to use
        required: false
        default: "1.96.0"
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: ${{ inputs.rust_toolchain_version || '1.96.0' }}
  RUST_MIN_STACK: "67108864"
  RUSTFLAGS: "-Dwarnings -A unknown_lints -C link-arg=-fuse-ld=lld"
  # Mismo perfil no-LTO que el binario x64 de B1: el VPS aarch64 tiene
  # 4 vCPU y 23 GB, y el A/B debe usar el mismo perfil en ambas ramas.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_BUILD_JOBS: "4"

jobs:
  build_linux_arm64_release:
    name: Build Linux ARM64 release for B1
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - run: rustup update ${{ env.RUSTUP_TOOLCHAIN }} && rustup default ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Instalar lld
        run: sudo apt-get update && sudo apt-get install -y lld
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: b1-release-${{ runner.os }}-${{ runner.arch }}
      - name: Build release binary
        run: cargo build --release --locked -p pumpkin
      - name: Strip binary
        run: strip target/release/pumpkin
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: pumpkin-linux-arm64-b1
          path: target/release/pumpkin
          retention-days: 7
